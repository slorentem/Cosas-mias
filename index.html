<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Una pregunta importante</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100svh;
			margin: 0;
			padding: clamp(0px, 2vw, 24px);
			display: grid;
			place-items: center;
			overflow-x: hidden;
			font-family: Arial, sans-serif;
			color: #e8ffff;
			background: #030a0b;
		}

		.escena {
			position: relative;
			isolation: isolate;
			width: min(100%, 1365px);
			aspect-ratio: 1365 / 768;
			overflow: hidden;
			border: 1px solid rgba(73, 225, 211, 0.3);
			border-radius: clamp(0px, 1.6vw, 22px);
			background-color: #061011;
			box-shadow: 0 28px 90px rgba(0, 0, 0, 0.65);
			text-align: center;
		}

		.personajes {
			position: absolute;
			inset: 0;
			border-radius: inherit;
			background-color: #061011;
			background-image:
				linear-gradient(90deg, rgba(2, 12, 13, 0.32), rgba(2, 12, 13, 0.08) 50%, rgba(2, 12, 13, 0.36)),
				linear-gradient(0deg, rgba(2, 12, 13, 0.3), transparent 38%, rgba(2, 12, 13, 0.12)),
				url("imagenes/referencia-terror.png");
			background-position: center, center, center;
			background-size: cover;
			background-repeat: no-repeat;
			pointer-events: none;
		}

		.propuesta {
			position: absolute;
			left: 50%;
			z-index: 1;
			width: min(100% - 32px, 560px);
			bottom: clamp(16px, 3vw, 32px);
			margin: 0;
			padding: 18px 24px 10px;
			border: 1px solid rgba(87, 226, 211, 0.38);
			border-radius: 20px;
			background:
				linear-gradient(145deg, rgba(5, 23, 24, 0.91), rgba(2, 11, 13, 0.88));
			box-shadow:
				0 24px 75px rgba(0, 0, 0, 0.68),
				0 0 28px rgba(36, 210, 195, 0.1),
				inset 0 1px 0 rgba(190, 255, 250, 0.08);
			backdrop-filter: blur(8px) saturate(0.9);
			transform: translateX(-50%);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #55ded0;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(1.8rem, 5vw, 2.7rem);
			line-height: 1.15;
			color: #e8ffff;
			text-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
		}

		.instruccion {
			margin: 8px 0 10px;
			color: #b3ccca;
			font-size: 1rem;
		}

		.botones {
			position: relative;
			min-height: 78px;
		}

		.boton {
			position: absolute;
			top: 50%;
			min-width: 126px;
			padding: 13px 22px;
			transform: translateY(-50%);
			border: 0;
			border-radius: 999px;
			font-size: 1rem;
			font-weight: 700;
			cursor: pointer;
			transition: box-shadow 160ms ease, background-color 160ms ease;
		}

		.boton:focus-visible {
			outline: 3px solid #54e1d2;
			outline-offset: 4px;
		}

		.boton-si {
			left: calc(50% - 137px);
			color: #fff;
			background: #13a99e;
			box-shadow: 0 6px 18px rgba(19, 169, 158, 0.35);
		}

		.boton-si:hover {
			background: #18c7b8;
		}

		.boton-no {
			left: calc(50% + 11px);
			color: #d8fffb;
			background: rgba(80, 203, 191, 0.12);
			box-shadow: inset 0 0 0 1px rgba(91, 225, 211, 0.24);
		}

		.boton-no:hover {
			background: rgba(80, 203, 191, 0.22);
		}

		.boton-no.huyendo {
			position: absolute;
			z-index: 20;
			transform: none;
			transition: left 180ms ease, top 180ms ease, background-color 160ms ease;
		}

		.respuesta {
			min-height: 1.5em;
			margin: 10px 0 0;
			color: #69e9dc;
			font-weight: 700;
		}

		.celebracion {
			position: fixed;
			z-index: 100;
			inset: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: radial-gradient(ellipse at center, rgba(12, 83, 81, 0.38), rgba(1, 7, 8, 0.7));
			pointer-events: none;
			animation: aparecer-celebracion 500ms ease-out both;
		}

		.destello-celebracion {
			position: absolute;
			inset: -30%;
			background: radial-gradient(ellipse at center, rgba(92, 255, 234, 0.52), transparent 44%);
			animation: destello-celebracion 1.2s ease-out both;
		}

		.mensaje-celebracion {
			position: relative;
			width: min(90vw, 680px);
			padding: clamp(28px, 6vw, 56px) 24px;
			border: 1px solid rgba(106, 255, 236, 0.7);
			border-radius: 28px;
			background: linear-gradient(145deg, rgba(4, 30, 31, 0.96), rgba(1, 10, 12, 0.96));
			box-shadow: 0 0 35px rgba(45, 240, 216, 0.45), 0 24px 90px rgba(0, 0, 0, 0.7);
			color: #effffd;
			text-align: center;
			animation: entrada-mensaje 750ms cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
		}

		.mensaje-celebracion span {
			display: block;
			color: #6df5e1;
			font-size: clamp(0.85rem, 2vw, 1.1rem);
			font-weight: 700;
			letter-spacing: 0.24em;
			text-transform: uppercase;
		}

		.mensaje-celebracion strong {
			display: block;
			margin: 12px 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2rem, 7vw, 4.2rem);
			line-height: 1;
			text-shadow: 0 0 24px rgba(65, 255, 224, 0.55);
		}

		.particula {
			position: absolute;
			top: -24px;
			left: var(--x);
			width: 9px;
			height: 16px;
			border-radius: 3px;
			background: var(--color);
			box-shadow: 0 0 12px var(--color);
			animation: caer-confeti var(--duracion) linear var(--retraso) both;
		}

		.particula:nth-child(3n) {
			width: 12px;
			height: 12px;
			border-radius: 50%;
		}

		.escena.celebrando {
			animation: temblor-escena 650ms ease-in-out 2;
		}

		@keyframes aparecer-celebracion {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		@keyframes destello-celebracion {
			0% { opacity: 0; transform: scale(0.35); }
			30% { opacity: 1; }
			100% { opacity: 0; transform: scale(1.15); }
		}

		@keyframes entrada-mensaje {
			from { opacity: 0; transform: translateY(40px) scale(0.72) rotate(-3deg); }
			to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
		}

		@keyframes caer-confeti {
			from { transform: translate3d(0, -4vh, 0) rotate(0deg); }
			to { transform: translate3d(24px, 112vh, 0) rotate(var(--rotacion)); }
		}

		@keyframes temblor-escena {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(4px, -3px); }
			50% { transform: translate(-3px, 2px); }
			75% { transform: translate(2px, 3px); }
		}

		@media (max-width: 420px) {
			body {
				padding: 10px;
			}

			.escena {
				aspect-ratio: auto;
				min-height: 0;
				padding-bottom: 12px;
			}

			.personajes {
				position: relative;
				inset: auto;
				width: 100%;
				aspect-ratio: 1365 / 768;
				background-position: center, center, top center;
				background-size: 100% auto;
				flex: none;
			}

			.propuesta {
				position: relative;
				bottom: auto;
				left: auto;
				width: min(100% - 20px, 560px);
				margin: -14px auto 0;
				padding-top: 18px;
				padding-right: 16px;
				padding-left: 16px;
				transform: none;
			}

			.boton {
				min-width: 108px;
				padding-right: 16px;
				padding-left: 16px;
			}

			.boton-si {
				left: calc(50% - 116px);
			}

			.boton-no {
				left: calc(50% + 8px);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.boton,
			.escena.celebrando,
			.celebracion,
			.destello-celebracion,
			.mensaje-celebracion,
			.particula {
				transition: none;
				animation-duration: 0.01ms;
				animation-iteration-count: 1;
			}

			.boton-no.huyendo {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<main class="escena">
		<div class="personajes" role="img" aria-label="Ghost de Call of Duty, Ghostface y Jason de Viernes 13 en una escena oscura"></div>

		<section class="propuesta" aria-labelledby="pregunta">
			<p class="eyebrow">Una pregunta importante</p>
			<h1 id="pregunta">¿Puedo tener el honor de que seas mi novia?</h1>

			<form id="formulario-propuesta">
				<div class="botones" id="zona-botones">
					<button class="boton boton-si" id="boton-si" type="submit">Sí</button>
					<button class="boton boton-no" id="boton-no" type="button" form="formulario-propuesta">No</button>
				</div>
				<p class="respuesta" id="respuesta" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script>
		const escena = document.querySelector(".escena");
		const botonNo = document.getElementById("boton-no");
		const formulario = document.getElementById("formulario-propuesta");
		const respuesta = document.getElementById("respuesta");

		function moverBotonNo(evento) {
			const limites = escena.getBoundingClientRect();
			const boton = botonNo.getBoundingClientRect();
			const botonAfirmativo = document.getElementById("boton-si").getBoundingClientRect();
			const margen = 12;
			const bordeX = limites.left + escena.clientLeft;
			const bordeY = limites.top + escena.clientTop;
			const xMin = bordeX + margen;
			const yMin = bordeY + margen;
			const xMax = bordeX + escena.clientWidth - boton.width - margen;
			const yMax = bordeY + escena.clientHeight - boton.height - margen;

			if (xMax <= xMin || yMax <= yMin) return;

			for (let intento = 0; intento < 100; intento++) {
				const x = xMin + Math.random() * (xMax - xMin);
				const y = yMin + Math.random() * (yMax - yMin);
				const noSeSolapaConSi =
					x + boton.width < botonAfirmativo.left ||
					x > botonAfirmativo.right ||
					y + boton.height < botonAfirmativo.top ||
					y > botonAfirmativo.bottom;
				const punteroLejos =
					Math.hypot(evento.clientX - (x + boton.width / 2), evento.clientY - (y + boton.height / 2)) > 100;

				if (punteroLejos && noSeSolapaConSi) {
					escena.append(botonNo);
					botonNo.classList.add("huyendo");
					botonNo.style.left = `${x - bordeX}px`;
					botonNo.style.top = `${y - bordeY}px`;
					return;
				}
			}
		}

		botonNo.addEventListener("pointerenter", moverBotonNo);
		botonNo.addEventListener("pointerdown", evento => {
			if (evento.pointerType !== "mouse") moverBotonNo(evento);
		});

		window.addEventListener("resize", () => {
			document.getElementById("zona-botones").append(botonNo);
			botonNo.classList.remove("huyendo");
			botonNo.style.left = "";
			botonNo.style.top = "";
		});

		formulario.addEventListener("submit", evento => {
			evento.preventDefault();
			respuesta.textContent = "¡Sabía que dirías que sí!";

			if (document.querySelector(".celebracion")) return;

			escena.classList.add("celebrando");
			const celebracion = document.createElement("div");
			celebracion.className = "celebracion";
			celebracion.setAttribute("aria-hidden", "true");

			const destello = document.createElement("div");
			destello.className = "destello-celebracion";
			celebracion.append(destello);

			const mensaje = document.createElement("div");
			mensaje.className = "mensaje-celebracion";
			const titulo = document.createElement("span");
			titulo.textContent = "SIUUUUUUUUUUUUUU";
			const celebracionTexto = document.createElement("strong");
			celebracionTexto.textContent = "¡LETS GOOOOOOOO!";
			const cierre = document.createElement("span");
			cierre.textContent = "Enviame un whatsapp cuando lo hayas visto :)";
			mensaje.append(titulo, celebracionTexto, cierre);
			celebracion.append(mensaje);

			const colores = ["#49f5dd", "#10b9aa", "#b6fff5", "#f4ffff"];
			for (let indice = 0; indice < 64; indice++) {
				const particula = document.createElement("span");
				particula.className = "particula";
				particula.style.setProperty("--x", `${Math.random() * 100}%`);
				particula.style.setProperty("--retraso", `${Math.random() * 1.3}s`);
				particula.style.setProperty("--duracion", `${2.2 + Math.random() * 1.8}s`);
				particula.style.setProperty("--rotacion", `${Math.random() * 900 - 450}deg`);
				particula.style.setProperty("--color", colores[indice % colores.length]);
				celebracion.append(particula);
			}

			document.body.append(celebracion);
			window.setTimeout(() => {
				celebracion.remove();
				escena.classList.remove("celebrando");
			}, 5500);
		});
	</script>
</body>
</html>
